name: Weekly Data Update

on:
  schedule:
    # 每周一 03:00 UTC = 北京时间 11:00
    - cron: '0 3 * * 1'
  # 支持手动触发
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 抓取 mtgtop8 数据（最近3个月上位）
        run: |
          python -m scripts.mtgtop8_scraper.main update \
            --months 3 \
            --formats standard,modern,pauper \
            --max-pages 8

      - name: 抓取 EDHREC By Type 数据（Past Month）
        # 每周更新 EDHREC Past Month 数据（7 种类型 × 100 张，约 10 秒）
        run: |
          cd scripts && python -m card_keeper.fetch_edhrec_by_type fetch month

      - name: 构建数据库 + 计算趋势
        run: python scripts/build_deploy.py

      - name: 压缩数据库（移除可计算字段）
        run: python scripts/card_keeper/compress_deploy.py

      - name: 抓取卡牌系列信息（Scryfall Bulk Data）
        run: python scripts/fetch_sets_bulk.py

      - name: 清理旧快照（保留12周）
        run: python scripts/prune_history.py --keep 12

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "无数据变化，跳过提交。"
          else
            git commit -m "chore: weekly data update $(date -u +%Y-%m-%d)"
            git push
          fi
