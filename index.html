<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTG 卡牌保留价值查询</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  background: #ffffff; color: #333333; min-height: 100vh;
}

/* 搜索区 */
.search-bar {
  background: #ffffff; padding: 20px; text-align: center;
  border-bottom: 2px solid #dee2e6; position: sticky; top: 0; z-index: 100;
}
.search-bar h1 { color: #6c757d; font-size: 1.4em; margin-bottom: 12px; }
.search-box { position: relative; max-width: 600px; margin: 0 auto; }
.search-box input {
  width: 100%; padding: 12px 16px; font-size: 16px;
  border: 2px solid #dee2e6; border-radius: 8px;
  background: #f1f3f5; color: #333333; outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus { border-color: #5eb3f3; }
.search-box input::placeholder { color: #ced4da; }

/* 自动补全下拉 */
.autocomplete {
  position: absolute; top: 100%; left: 0; right: 0;
  background: #ffffff; border: 1px solid #dee2e6; border-radius: 0 0 8px 8px;
  max-height: 300px; overflow-y: auto; z-index: 101; display: none;
}
.autocomplete.active { display: block; }
.autocomplete-item {
  padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #dee2e6;
  display: flex; justify-content: space-between; align-items: center;
}
.autocomplete-item:hover { background: #dee2e6; }
.autocomplete-item .cn { color: #6c757d; font-size: 0.9em; }

/* 稀有度颜色 */
.r-mythic { color: #d97706; }
.r-rare { color: #b8860b; }
.r-uncommon { color: #6c757d; }
.r-common { color: #495057; }

/* 结果区 */
.result-container { max-width: 1400px; margin: 20px auto; padding: 0 16px; }

.card-result {
  background: #ffffff; border-radius: 12px; padding: 24px;
  margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

/* 卡牌基本信息 */
.card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
.card-title h2 { font-size: 1.5em; margin-bottom: 4px; }
.card-title .cn-name { color: #6c757d; font-size: 1.1em; }
.card-meta { text-align: right; font-size: 0.9em; color: #6c757d; }
.card-meta .badge {
  display: inline-block; padding: 4px 10px; border-radius: 4px;
  font-size: 0.85em; margin-left: 6px; font-weight: bold;
}

/* 保留建议大标签 */
.recommendation-banner {
  padding: 12px 20px; border-radius: 8px; text-align: center;
  font-size: 1.2em; font-weight: bold; margin-bottom: 20px;
}

/* 使用情况区域 */
.section { margin-bottom: 20px; }
.section h3 {
  font-size: 1.1em; color: #6c757d; margin-bottom: 10px;
  border-bottom: 1px solid #dee2e6; padding-bottom: 6px;
}

/* 构筑使用表格 */
.constructed-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
}
.format-card {
  background: #f1f3f5; border-radius: 8px; padding: 14px;
  text-align: center; border: 2px solid transparent;
}
.format-card.active { border-color: #5eb3f3; }
.format-card .fmt-name { font-size: 0.85em; color: #6c757d; margin-bottom: 6px; }
.format-card .fmt-count { font-size: 1.8em; font-weight: bold; }
.format-card .fmt-sb { font-size: 0.8em; color: #6c757d; margin-top: 4px; }
.format-card.inactive .fmt-count { color: #ced4da; }

/* EDH 信息 */
.edh-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.edh-stat {
  background: #f1f3f5; border-radius: 8px; padding: 14px; text-align: center;
}
.edh-stat .label { font-size: 0.8em; color: #6c757d; margin-bottom: 6px; }
.edh-stat .value { font-size: 1.4em; font-weight: bold; }

/* 统计信息 */
.stats-bar {
  display: flex; gap: 20px; justify-content: center;
  color: #6c757d; font-size: 0.85em; margin-top: 20px;
}

/* 空状态 */
.empty {
  text-align: center; padding: 60px 20px; color: #ced4da;
}
.empty h3 { font-size: 1.2em; margin-bottom: 8px; }

/* 加载中 */
.loading { text-align: center; padding: 40px; color: #5eb3f3; }
.loading .spinner {
  display: inline-block; width: 40px; height: 40px;
  border: 3px solid #dee2e6; border-top-color: #5eb3f3;
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Tab 栏 */
.tabs {
  display: flex; gap: 8px; justify-content: center; margin-bottom: 12px;
}
.tab {
  padding: 8px 20px; border: 2px solid #dee2e6; border-radius: 8px;
  background: #f1f3f5; color: #6c757d; cursor: pointer; font-size: 0.95em;
  transition: all 0.2s;
}
.tab:hover { border-color: #5eb3f3; color: #333333; }
.tab.active { background: #5eb3f3; color: #1c5fa8; border-color: #5eb3f3; font-weight: bold; }

/* 系列浏览器 */
.set-browser { margin-bottom: 16px; }
.set-search-box { position: relative; max-width: 600px; margin: 0 auto 12px; }
.set-search-box input {
  width: 100%; padding: 10px 16px; font-size: 15px;
  border: 2px solid #dee2e6; border-radius: 8px;
  background: #f1f3f5; color: #333333; outline: none;
}
.set-search-box input:focus { border-color: #5eb3f3; }

.set-list {
  max-height: 300px; overflow-y: auto; max-width: 600px; margin: 0 auto;
  background: #ffffff; border-radius: 8px; border: 1px solid #dee2e6;
}
.set-item {
  padding: 10px 16px; cursor: pointer; border-bottom: 1px solid #dee2e6;
  display: flex; justify-content: space-between; align-items: center;
  transition: background 0.15s;
}
.set-item:hover { background: #dee2e6; }
.set-item.selected { background: #dee2e6; border-left: 3px solid #5eb3f3; }
.set-item .set-name { font-size: 0.95em; }
.set-item .set-code { color: #6c757d; font-size: 0.85em; margin-left: 8px; }
.set-item .set-count {
  background: #e9ecef; color: #6c757d; padding: 2px 8px; border-radius: 4px;
  font-size: 0.8em; white-space: nowrap;
}

/* 系列卡牌列表 */
.set-cards-header {
  font-size: 1.1em; color: #6c757d; margin: 20px 0 10px;
  border-bottom: 1px solid #dee2e6; padding-bottom: 6px;
}
.set-card-item {
  background: #ffffff; border-radius: 8px; padding: 12px 16px;
  margin-bottom: 8px; display: flex; justify-content: space-between;
  align-items: center; cursor: pointer; transition: background 0.15s;
  border-left: 3px solid transparent;
}
.set-card-item:hover { background: #f1f3f5; border-left-color: #5eb3f3; }
.set-card-item .sci-name { font-weight: bold; }
.set-card-item .sci-cn { color: #6c757d; font-size: 0.9em; margin-left: 8px; }
.set-card-item .sci-badge {
  display: inline-block; padding: 3px 10px; border-radius: 4px;
  font-size: 0.8em; font-weight: bold; color: #fff; white-space: nowrap;
}

/* 趋势指示器 */
.trend { font-size: 0.85em; margin-left: 6px; white-space: nowrap; }
.trend-up { color: #51cf66; }
.trend-down { color: #ff6b6b; }
.trend-same { color: #6c757d; }
.trend-new { color: #ffd43b; }

/* Combo 标签（卡牌详情中） */
.combo-tag {
  display: inline-block; padding: 3px 10px; border-radius: 4px;
  font-size: 0.8em; font-weight: bold; color: #1c5fa8;
  background: #5eb3f3; margin-left: 6px;
}

/* 响应式 */
@media (max-width: 600px) {
  .constructed-grid, .edh-grid { grid-template-columns: repeat(2, 1fr); }
  .card-header { flex-direction: column; }
  .card-meta { text-align: left; margin-top: 10px; }
}

/* ========== 卡牌详情三栏布局 ========== */
.card-detail-layout {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
}

/* 左侧：卡牌图片 */
.card-image-panel {
  flex: 0 0 223px;
  text-align: center;
}
.card-image-panel img {
  width: 223px;
  border-radius: 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}
.card-image-panel .image-loading {
  width: 223px;
  height: 311px;
  background: #f1f3f5;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ced4da;
  font-size: 0.9em;
}

/* 中间：基本信息 + 使用数据 */
.card-info-panel {
  flex: 1;
  min-width: 280px;
}

/* 右侧：所有印刷版本 */
.card-prints-panel {
  flex: 0 0 300px;
  max-height: 600px;
  overflow-y: auto;
  background: #f1f3f5;
  border-radius: 8px;
  padding: 12px;
}
.print-item {
  padding: 8px 10px;
  border-bottom: 1px solid #dee2e6;
  font-size: 0.85em;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  transition: background 0.15s;
}
.print-item:hover { background: #dee2e6; }
.print-item.current {
  background: #dee2e6;
  border-left: 3px solid #5eb3f3;
}
.print-item .print-set { color: #495057; }
.print-item .print-num { color: #6c757d; font-size: 0.8em; }
.print-rarity {
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
  font-size: 0.75em;
  font-weight: bold;
}

/* 法术力符号 */
.mana-symbol {
  height: 1.1em;
  vertical-align: middle;
  margin: 0 1px;
}

/* 神谕文本框 */
.oracle-text-box {
  background: #f1f3f5;
  border-radius: 8px;
  padding: 14px 18px;
  margin-top: 12px;
  font-size: 0.95em;
  line-height: 1.6;
  color: #495057;
  border-left: 3px solid #dee2e6;
  white-space: pre-line;
}

/* 趋势折线图 */
.trend-chart-container {
  margin-top: 16px;
  background: #f1f3f5;
  border-radius: 8px;
  padding: 16px;
}
.trend-chart-container canvas {
  max-height: 260px;
}

/* EDH Top Commanders */
.edh-commanders {
  margin-top: 16px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.commander-card {
  flex: 0 0 auto;
  text-align: center;
  background: #f1f3f5;
  border-radius: 8px;
  padding: 10px;
  width: 160px;
  transition: transform 0.15s;
}
.commander-card:hover { transform: translateY(-2px); }
.commander-card img {
  width: 140px;
  height: auto;
  border-radius: 6px;
  margin-bottom: 8px;
}
.commander-card .cmdr-loading {
  width: 140px;
  height: 195px;
  background: #dee2e6;
  border-radius: 6px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #ced4da;
  font-size: 0.8em;
}
.commander-card .cmdr-name {
  font-size: 0.8em;
  color: #495057;
  line-height: 1.3;
}
.commander-card .cmdr-decks {
  font-size: 0.75em;
  color: #6c757d;
  margin-top: 2px;
}

/* 响应式：移动端降级为单栏 */
@media (max-width: 1100px) {
  .card-detail-layout {
    flex-direction: column;
  }
  .card-image-panel {
    flex: 0 0 auto;
    text-align: center;
  }
  .card-prints-panel {
    flex: 0 0 auto;
    max-height: 300px;
  }
}
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>

<div class="search-bar">
  <h1>🃏 MTG 卡牌保留价值查询</h1>
  <div class="tabs">
    <button class="tab active" data-tab="search" id="tabSearch">🔍 卡牌查询</button>
    <button class="tab" data-tab="sets" id="tabSets">📦 按系列浏览</button>
  </div>
  <div class="search-box" id="searchBox">
    <input type="text" id="searchInput" placeholder="输入卡牌英文名或中文名..." autocomplete="off" disabled>
    <div class="autocomplete" id="autocomplete"></div>
  </div>
  <div class="stats-bar" id="statsBar">数据库加载中...</div>
</div>

<!-- 查询 Tab -->
<div class="result-container" id="resultContainer">
  <div class="loading" id="loadingIndicator">
    <div class="spinner"></div>
    <p>正在加载数据库（约 2MB）...</p>
  </div>
</div>

<!-- 按系列浏览 Tab -->
<div class="result-container" id="setsContainer" style="display:none">
  <div class="set-browser">
    <div class="set-search-box">
      <input type="text" id="setFilterInput" placeholder="搜索系列名称或代码..." disabled>
    </div>
    <div class="set-list" id="setList"></div>
  </div>
  <div id="setCardsContainer"></div>
</div>

<script src="scryfall.js"></script>
<script src="app.js"></script>
<script>
const searchInput = document.getElementById('searchInput');
const autocomplete = document.getElementById('autocomplete');
const resultContainer = document.getElementById('resultContainer');
const statsBar = document.getElementById('statsBar');

// 系列 Tab 元素
const setsContainer = document.getElementById('setsContainer');
const setList = document.getElementById('setList');
const setFilterInput = document.getElementById('setFilterInput');
const setCardsContainer = document.getElementById('setCardsContainer');
const tabSearch = document.getElementById('tabSearch');
const tabSets = document.getElementById('tabSets');
const searchBox = document.getElementById('searchBox');

let debounceTimer = null;
let selectedIdx = -1;
let currentResults = [];
let currentSetCode = null;  // 当前选中的系列代码

// ============================================================
// 初始化：加载数据库
// ============================================================

CardKeeper.init('card_database.json', 'sets_index.json').then(() => {
  // 隐藏加载提示
  document.getElementById('loadingIndicator').remove();

  // 显示统计
  const s = CardKeeper.stats();
  statsBar.textContent =
    `📊 共 ${s.total_cards} 张卡 | 构筑数据 ${s.has_constructed} 张 | EDH数据 ${s.has_edh} 张`;

  // 启用搜索框
  searchInput.disabled = false;
  searchInput.focus();

  // 显示欢迎信息
  resultContainer.innerHTML = `
    <div class="empty">
      <h3>输入卡名开始查询</h3>
      <p>综合 Modern / Standard / Pauper 构筑赛制 + EDHREC EDH 使用数据</p>
    </div>
  `;

  // 初始化系列浏览
  if (Object.keys(CardKeeper.setsIndex).length > 0) {
    setFilterInput.disabled = false;
    renderSetList('');
    setFilterInput.addEventListener('input', () => {
      renderSetList(setFilterInput.value.trim().toLowerCase());
    });
  } else {
    setFilterInput.placeholder = '系列数据未加载';
  }
}).catch(err => {
  document.getElementById('loadingIndicator').remove();
  statsBar.textContent = '❌ 数据库加载失败';
  resultContainer.innerHTML = `
    <div class="empty">
      <h3>加载失败</h3>
      <p>${err.message}</p>
      <p style="margin-top:10px;color:#868e96">请确保 card_database.json 与 index.html 在同一目录</p>
    </div>
  `;
});

// ============================================================
// Tab 切换
// ============================================================

tabSearch.addEventListener('click', () => switchTab('search'), false);
tabSets.addEventListener('click', () => switchTab('sets'), false);

function switchTab(tab) {
  // 统一移除所有 active
  tabSearch.classList.remove('active');
  tabSets.classList.remove('active');
  // 统一隐藏所有容器
  searchBox.style.display = 'none';
  resultContainer.style.display = 'none';
  setsContainer.style.display = 'none';

  if (tab === 'search') {
    tabSearch.classList.add('active');
    searchBox.style.display = '';
    resultContainer.style.display = '';
    searchInput.focus();
  } else if (tab === 'sets') {
    tabSets.classList.add('active');
    setsContainer.style.display = '';
    setFilterInput.focus();
  }
}

// ============================================================
// 系列浏览：系列列表渲染与筛选
// ============================================================

function renderSetList(filter) {
  const allSets = CardKeeper.getAllSets();
  const filtered = filter
    ? allSets.filter(s =>
        s.name.toLowerCase().includes(filter) || s.code.toLowerCase().includes(filter))
    : allSets;

  if (filtered.length === 0) {
    setList.innerHTML = '<div style="padding:16px;text-align:center;color:#adb5bd">无匹配系列</div>';
    return;
  }

  setList.innerHTML = filtered.map(s => `
    <div class="set-item ${s.code === currentSetCode ? 'selected' : ''}" data-code="${escapeHtml(s.code)}">
      <span><span class="set-name">${escapeHtml(s.name)}</span><span class="set-code">${escapeHtml(s.code)}</span></span>
      <span class="set-count">${s.count} 张</span>
    </div>
  `).join('');

  setList.querySelectorAll('.set-item').forEach(item => {
    item.addEventListener('click', () => selectSet(item.dataset.code), false);
  });
}

function selectSet(code) {
  currentSetCode = code;
  // 更新选中高亮
  setList.querySelectorAll('.set-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.code === code);
  });
  renderSetCards(code);
}

function renderSetCards(code) {
  const setName = CardKeeper.setsIndex[code] || code;
  const cards = CardKeeper.getCardsBySet(code);

  if (cards.length === 0) {
    setCardsContainer.innerHTML = `<div class="empty"><h3>无卡牌</h3></div>`;
    return;
  }

  setCardsContainer.innerHTML = `
    <div class="set-cards-header">📦 ${escapeHtml(setName)} (${code}) — ${cards.length} 张可用卡</div>
  ` + cards.map(card => {
    const rarityClass = `r-${card.rarity || 'common'}`;
    const recColor = card.recommendation_color || '#868e96';
    const recLabel = card.recommendation_label || '';
    return `<div class="set-card-item" data-name="${escapeHtml(card.name)}">
      <span>
        <span class="sci-name ${rarityClass}">${escapeHtml(card.name)}</span>
        <span class="sci-cn">${escapeHtml(card.chinese_name || '')}</span>
      </span>
      <span class="sci-badge" style="background:${recColor}">${recLabel}</span>
    </div>`;
  }).join('');

  // 点击卡牌查看详情
  setCardsContainer.querySelectorAll('.set-card-item').forEach(item => {
    item.addEventListener('click', () => {
      const card = CardKeeper.getCard(item.dataset.name);
      if (card) {
        renderCard(card, setCardsContainer, code);
      }
    }, false);
  });
}

// ============================================================
// 搜索输入 → 自动补全（本地查询）
// ============================================================

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (!q) { autocomplete.classList.remove('active'); return; }
  debounceTimer = setTimeout(() => doSearch(q), 200);
}, false);

// 键盘导航
searchInput.addEventListener('keydown', (e) => {
  if (!autocomplete.classList.contains('active')) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    selectedIdx = Math.min(selectedIdx + 1, currentResults.length - 1);
    highlightItem();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    selectedIdx = Math.max(selectedIdx - 1, 0);
    highlightItem();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (selectedIdx >= 0 && currentResults[selectedIdx]) {
      fetchCard(currentResults[selectedIdx].name);
    } else if (currentResults.length > 0) {
      fetchCard(currentResults[0].name);
    }
  }
}, false);

// 点击外部关闭自动补全
document.addEventListener('click', (e) => {
  if (!e.target.closest('.search-box')) {
    autocomplete.classList.remove('active');
  }
}, false);

// ============================================================
// 本地查询（替换原 API 调用）
// ============================================================

function doSearch(q) {
  currentResults = CardKeeper.search(q, 15);
  selectedIdx = -1;
  renderAutocomplete(currentResults);
}

function fetchCard(name) {
  autocomplete.classList.remove('active');
  searchInput.value = name;

  const card = CardKeeper.getCard(name);
  if (card) {
    renderCard(card);
  } else {
    resultContainer.innerHTML = `<div class="empty"><h3>未找到</h3><p>卡牌 "${escapeHtml(name)}" 未收录</p></div>`;
  }
}

// ============================================================
// 渲染（与原版 UI 保持一致）
// ============================================================

function renderAutocomplete(results) {
  if (!results.length) {
    autocomplete.classList.remove('active');
    return;
  }
  autocomplete.innerHTML = results.map((r, i) => {
    const rarityClass = `r-${r.rarity || 'common'}`;
    return `<div class="autocomplete-item" data-idx="${i}" data-name="${escapeHtml(r.name)}">
      <span class="${rarityClass}">${escapeHtml(r.name)}</span>
      <span class="cn">${escapeHtml(r.chinese_name || '')} ${r.recommendation_label || ''}</span>
    </div>`;
  }).join('');
  autocomplete.classList.add('active');

  // 点击选择
  autocomplete.querySelectorAll('.autocomplete-item').forEach(item => {
    item.addEventListener('click', () => {
      fetchCard(item.dataset.name);
    });
  });
}

function highlightItem() {
  autocomplete.querySelectorAll('.autocomplete-item').forEach((el, i) => {
    el.style.background = i === selectedIdx ? '#dee2e6' : '';
  });
}

function renderCard(card, target, setCode) {
  const container = target || resultContainer;
  const rarityClass = 'r-' + (card.rarity || 'common');
  const recColor = card.recommendation_color || '#868e96';

  // 构筑使用
  const formats = ['standard', 'modern', 'pauper'];
  const fmtNames = { standard: 'Standard', modern: 'Modern', pauper: 'Pauper' };
  const constructedHtml = formats.map(function(f) {
    const data = (card.constructed || {})[f] || { count: 0, sideboard: 0 };
    const total = (data.count || 0) + (data.sideboard || 0);
    const active = total > 0;
    const sbText = data.sideboard > 0 ? '+' + data.sideboard + ' 备牌' : '';
    return '<div class="format-card ' + (active ? 'active' : 'inactive') + '">' +
      '<div class="fmt-name">' + fmtNames[f] + '</div>' +
      '<div class="fmt-count">' + (data.count || 0) + '</div>' +
      '<div class="fmt-sb">' + sbText + '</div>' +
    '</div>';
  }).join('');

  // EDH 信息
  const edh = card.edh;
  let edhHtml;
  if (edh) {
    const inclusionPct = (edh.inclusion * 100).toFixed(1);
    const numDecksStr = formatNumber(edh.num_decks);
    edhHtml =
      '<div class="edh-stat"><div class="label">使用卡组数</div><div class="value">' + numDecksStr + '</div></div>' +
      '<div class="edh-stat"><div class="label">包含率</div><div class="value">' + inclusionPct + '%</div></div>' +
      '<div class="edh-stat"><div class="label">Salt</div><div class="value">' + ((edh.salt || 0).toFixed(2)) + '</div></div>' +
      '<div class="edh-stat"><div class="label">等级</div><div class="value" style="font-size:1.1em">' + (card.edh_tier_label || '') + '</div></div>';
  } else {
    edhHtml = '<div class="edh-stat" style="grid-column:span 4"><div class="label">无 EDHREC 数据（冷门卡或未预缓存）</div></div>';
  }

  // 颜色标识
  const colors = card.colors || [];
  const colorSymbols = { W: '⚪', U: '🔵', B: '⚫', R: '🔴', G: '🟢' };
  const colorStr = colors.length ? colors.map(function(c) { return colorSymbols[c] || c; }).join(' ') : '无色';

  // 趋势指示器
  const trend = card.trend || {};
  const trendIcon = function(t) {
    if (t === 'up') return '<span class="trend trend-up">↑上升</span>';
    if (t === 'down') return '<span class="trend trend-down">↓下降</span>';
    if (t === 'new') return '<span class="trend trend-new">✨新增</span>';
    return '<span class="trend trend-same">→持平</span>';
  };

  // 趋势图
  const trendData = CardKeeper.getUsageTrend(card.name);
  let trendChartHtml = '';
  if (trendData && trendData.dates.length >= 2) {
    trendChartHtml = '<div class="trend-chart-container"><canvas id="trendChart" width="800" height="240"></canvas></div>';
  }

  const backBtn = setCode
    ? '<div style="margin-bottom:12px"><button class="tab" onclick="renderSetCards(\'' + setCode + '\')" style="cursor:pointer">← 返回列表</button></div>'
    : '';

  const comboTag = card.combo_legacy
    ? '<span class="combo-tag">🔥 Combo潜力</span>'
    : '';

  // 渲染三栏布局
  container.innerHTML = backBtn +
    '<div class="card-result">' +
      '<div class="card-header">' +
        '<div class="card-title">' +
          '<h2 class="' + rarityClass + '">' + escapeHtml(card.name) + '</h2>' +
          '<div class="cn-name">' + escapeHtml(card.chinese_name || '（无中文名）') + '</div>' +
        '</div>' +
        '<div class="card-meta">' +
          '<span class="' + rarityClass + '">' + (card.rarity_cn || card.rarity || '') + '</span>' +
          '<span class="badge" style="background:' + recColor + ';color:#fff">' + (card.recommendation_label || '') + '</span>' +
          comboTag +
        '</div>' +
      '</div>' +

      '<div class="recommendation-banner" style="background:' + recColor + ';color:#fff">' +
        (card.recommendation_label || '未知') +
      '</div>' +

      '<div class="card-detail-layout">' +
        // 左侧：卡牌图片
        '<div class="card-image-panel" id="cardImagePanel">' +
          '<div class="image-loading">🖼️ 加载中...</div>' +
        '</div>' +

        // 中间：基本信息 + 使用数据
        '<div class="card-info-panel">' +
          '<div class="section" id="cardBasicInfo">' +
            '<h3>📋 基本信息</h3>' +
            '<div style="display:flex;gap:20px;flex-wrap:wrap;font-size:0.95em;color:#6c757d">' +
              '<span>类型: ' + escapeHtml(card.type_line || '未知') + '</span>' +
              '<span>颜色: ' + colorStr + '</span>' +
              '<span>CMC: ' + (card.cmc || 0) + '</span>' +
            '</div>' +
            '<div class="oracle-text-box" id="oracleTextBox">' +
              '<span style="color:#adb5bd">加载规则文本中...</span>' +
            '</div>' +
          '</div>' +

          '<div class="section">' +
            '<h3>🏟️ 构筑赛制使用（最近2周上位）' + trendIcon(trend.constructed) + '</h3>' +
            '<div class="constructed-grid">' + constructedHtml + '</div>' +
            trendChartHtml +
          '</div>' +

          '<div class="section">' +
            '<h3>🐉 EDH 使用情况（EDHREC）' + trendIcon(trend.edh) + '</h3>' +
            '<div class="edh-grid">' + edhHtml + '</div>' +
            '<div id="edhCommanders" style="margin-top:12px"></div>' +
          '</div>' +
        '</div>' +

        // 右侧：所有印刷版本
        '<div class="card-prints-panel" id="cardPrintsPanel">' +
          '<div style="font-size:0.9em;color:#5eb3f3;margin-bottom:8px;font-weight:bold">📚 所有印刷版本</div>' +
          '<div id="printsList" style="color:#adb5bd">加载中...</div>' +
        '</div>' +
      '</div>' +
    '</div>';

  // 初始化趋势图
  if (trendData && trendData.dates.length >= 2) {
    setTimeout(function() { initTrendChart(trendData.dates, trendData.datasets); }, 100);
  }

  // 异步加载 Scryfall 详细信息
  loadScryfallDetails(card.name);

  // 异步加载 EDHREC Top Commanders
  if (edh) {
    loadEDHCommanders(card.name);
  }
}

// ============================================================
// Scryfall 异步加载
// ============================================================

async function loadScryfallDetails(cardName) {
  try {
    const scryfallData = await ScryfallService.fetchCard(cardName);

    // 1. 更新卡牌图片
    const imagePanel = document.getElementById('cardImagePanel');
    if (imagePanel) {
      const imageUri = ScryfallService._getImageUri(scryfallData);
      if (imageUri) {
        imagePanel.innerHTML = '<img src="' + imageUri + '" alt="' + escapeHtml(cardName) + '" ' +
          'onerror="this.parentElement.innerHTML=\'<div class=&quot;image-loading&quot;>🖼️ 图片加载失败</div>\'">';
      } else {
        imagePanel.innerHTML = '<div class="image-loading">🖼️ 无图片</div>';
      }
    }

    // 2. 更新基本信息（法术力费用 + 神谕文本 + 类型/颜色/CMC + 攻防）
    // 更新基本信息区域的类型/颜色/CMC（使用 Scryfall 数据补充）
    const basicInfo = document.getElementById('cardBasicInfo');
    if (basicInfo) {
      const sfType = scryfallData.type_line || '';
      const sfCmc = scryfallData.cmc != null ? scryfallData.cmc : '';
      const sfColors = scryfallData.colors || scryfallData.color_identity || [];
      const colorSymbols = { W: '⚪', U: '🔵', B: '⚫', R: '🔴', G: '🟢' };
      const colorStr = sfColors.length ? sfColors.map(function(c) { return colorSymbols[c] || c; }).join(' ') : '无色';
      const manaCostHtml = scryfallData.mana_cost
        ? ScryfallService.renderManaCost(scryfallData.mana_cost)
        : (sfCmc || '0');

      // Power/Toughness（生物、载具等有攻防的卡）
      let ptHtml = '';
      if (scryfallData.power != null && scryfallData.toughness != null
          && scryfallData.power !== '' && scryfallData.toughness !== '') {
        ptHtml = '<span>攻防: <strong style="color:#e03131;font-size:1.05em">' +
          escapeHtml(scryfallData.power) + '/' + escapeHtml(scryfallData.toughness) +
          '</strong></span>';
      }
      // 忠诚度（鹏洛客）
      let loyaltyHtml = '';
      if (scryfallData.loyalty != null && scryfallData.loyalty !== '') {
        loyaltyHtml = '<span>忠诚: <strong style="color:#5eb3f3">' +
          escapeHtml(scryfallData.loyalty) + '</strong></span>';
      }

      basicInfo.innerHTML =
        '<h3>📋 基本信息</h3>' +
        '<div style="display:flex;gap:20px;flex-wrap:wrap;font-size:0.95em;color:#6c757d">' +
          '<span>类型: ' + escapeHtml(sfType || '未知') + '</span>' +
          '<span>颜色: ' + colorStr + '</span>' +
          '<span>费用: ' + manaCostHtml + '</span>' +
          ptHtml +
          loyaltyHtml +
        '</div>' +
        '<div class="oracle-text-box" id="oracleTextBox">' +
          '<span style="color:#adb5bd">加载规则文本中...</span>' +
        '</div>';
    }

    // 重新获取 oracleBox 引用（因为 basicInfo.innerHTML 刚被重写）
    const oracleBox = document.getElementById('oracleTextBox');
    if (oracleBox && scryfallData.oracle_text) {
      let oracleHtml = '';
      // 法术力费用（仅单面牌在顶部显示，双面牌每个面单独显示）
      if (scryfallData.mana_cost && !(scryfallData.card_faces && scryfallData.card_faces.length > 1)) {
        oracleHtml += '<div style="margin-bottom:8px;font-size:1.1em;display:flex;align-items:center;gap:8px;flex-wrap:wrap">' +
          '<strong style="color:#868e96">费用:</strong> ' + ScryfallService.renderManaCost(scryfallData.mana_cost) + '</div>';
      }
      // 处理双面牌的神谕文本
      if (scryfallData.card_faces && scryfallData.card_faces.length > 1) {
        oracleHtml += scryfallData.card_faces.map(function(face, i) {
          const faceName = face.name || '';
          const faceOracle = face.oracle_text || '';
          const faceMana = face.mana_cost ? ScryfallService.renderManaCost(face.mana_cost) : '';
          // 每个面的攻防/忠诚
          let facePt = '';
          if (face.power != null && face.toughness != null
              && face.power !== '' && face.toughness !== '') {
            facePt = ' <strong style="color:#e03131">' +
              escapeHtml(face.power) + '/' + escapeHtml(face.toughness) + '</strong>';
          } else if (face.loyalty != null && face.loyalty !== '') {
            facePt = ' <strong style="color:#5eb3f3">忠诚 ' + escapeHtml(face.loyalty) + '</strong>';
          }
          return '<div style="margin-bottom:8px">' +
            '<strong style="color:#5eb3f3">' + escapeHtml(faceName) + '</strong> ' +
            faceMana + facePt + '<br>' + escapeHtml(faceOracle) +
            '</div>';
        }).join('<hr style="border-color:#dee2e6;margin:8px 0">');
      } else {
        oracleHtml += '<strong style="color:#868e96">效果:</strong><br>' + escapeHtml(scryfallData.oracle_text);
      }
      oracleBox.innerHTML = oracleHtml;
    }

    // 3. 加载所有印刷版本
    if (scryfallData.prints_search_uri) {
      const prints = await ScryfallService.fetchAllPrints(scryfallData.prints_search_uri);
      renderPrintsList(prints, scryfallData.set, scryfallData.collector_number);
    }
  } catch (err) {
    console.warn('Scryfall 详情加载失败:', err);
    const imagePanel = document.getElementById('cardImagePanel');
    if (imagePanel && imagePanel.querySelector('.image-loading')) {
      imagePanel.innerHTML = '<div class="image-loading">🖼️ 加载超时</div>';
    }
    const oracleBox = document.getElementById('oracleTextBox');
    if (oracleBox) {
      oracleBox.innerHTML = '<span style="color:#adb5bd">规则文本加载失败</span>';
    }
    const printsList = document.getElementById('printsList');
    if (printsList) {
      printsList.innerHTML = '<span style="color:#adb5bd">加载失败</span>';
    }
  }
}

function renderPrintsList(prints, currentSet, currentCollectorNumber) {
  const container = document.getElementById('printsList');
  if (!container) return;

  if (!prints || prints.length === 0) {
    container.innerHTML = '<span style="color:#adb5bd">无印刷数据</span>';
    return;
  }

  // 按发行日期排序（最新的在前）
  prints.sort(function(a, b) { return (b.released_at || '').localeCompare(a.released_at || ''); });

  const rarityColors = {
    mythic: '#f39c12', rare: '#f1c40f', uncommon: '#95a5a6',
    common: '#adb5bd', special: '#9b59b6', bonus: '#e74c3c',
  };

  container.innerHTML = prints.map(function(p) {
    const isCurrent = p.set === currentSet && p.collector_number === currentCollectorNumber;
    const rarityColor = rarityColors[p.rarity] || '#868e96';
    return '<div class="print-item' + (isCurrent ? ' current' : '') + '" ' +
      'data-image="' + (p.image_uri || '') + '" ' +
      'onclick="switchCardImage(this)">' +
      '<span>' +
        '<span class="print-set">' + escapeHtml(p.set_name) + '</span> ' +
        '<span class="print-num">(' + (p.set || '').toUpperCase() + ')</span>' +
      '</span>' +
      '<span>' +
        '<span class="print-rarity" style="background:' + rarityColor + ';color:#fff">' + (p.rarity || '?') + '</span> ' +
        '<span class="print-num">#' + p.collector_number + '</span>' +
      '</span>' +
    '</div>';
  }).join('');
}

function switchCardImage(el) {
  const imageUri = el.getAttribute('data-image');
  if (!imageUri) return;
  const imagePanel = document.getElementById('cardImagePanel');
  if (imagePanel) {
    imagePanel.innerHTML = '<img src="' + imageUri + '" alt="card image" ' +
      'onerror="this.parentElement.innerHTML=\'<div class=&quot;image-loading&quot;>🖼️ 图片加载失败</div>\'">';
  }
  // 更新当前选中高亮
  var items = document.querySelectorAll('.print-item');
  for (var i = 0; i < items.length; i++) {
    items[i].classList.remove('current');
  }
  el.classList.add('current');
}

// ============================================================
// EDHREC Top Commanders 异步加载
// ============================================================

async function loadEDHCommanders(cardName) {
  const container = document.getElementById('edhCommanders');
  if (!container) return;

  // 从 edhrec_cache 获取 slug（通过 CardKeeper 数据）
  const card = CardKeeper.cards[cardName];
  if (!card || !card.edh) return;

  // EDHREC slug 通常是卡名小写 + 连字符
  const slug = cardName.toLowerCase()
    .replace(/[^a-z0-9\s]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-');

  // 检查 localStorage 缓存
  const cacheKey = 'edhrec_cmdrs_' + slug;
  const cached = ScryfallService._getCache(cacheKey);
  if (cached) {
    renderCommanders(container, cached);
    return;
  }

  // 显示加载中
  container.innerHTML = '<div style="color:#adb5bd;font-size:0.85em;padding:8px">加载 Top Commanders...</div>';

  try {
    // 通过 CORS 代理获取 EDHREC 页面 HTML，提取 __NEXT_DATA__
    const edhrecUrl = 'https://edhrec.com/cards/' + slug;

    // 尝试多个 CORS 代理
    const proxies = [
      'https://corsproxy.io/?url=' + encodeURIComponent(edhrecUrl),
      'https://api.allorigins.win/raw?url=' + encodeURIComponent(edhrecUrl),
    ];

    let html = null;
    for (const proxyUrl of proxies) {
      try {
        const resp = await fetch(proxyUrl, { signal: AbortSignal.timeout(15000) });
        if (resp.ok) {
          html = await resp.text();
          if (html && html.length > 1000) break;
        }
      } catch (e) {
        continue;
      }
    }

    if (!html || html.length < 1000) {
      container.innerHTML = '';
      return;
    }

    // 从 HTML 中提取 __NEXT_DATA__ JSON
    const m = html.match(/<script id="__NEXT_DATA__"[^>]*>(.*?)<\/script>/s);
    if (!m) {
      container.innerHTML = '';
      return;
    }

    const nextData = JSON.parse(m[1]);
    const jsonDict = nextData?.props?.pageProps?.data?.container?.json_dict || {};

    // 从 cardlists 中找到 Top Commanders（url 包含 /commanders/）
    let commanders = [];
    const cardlists = jsonDict.cardlists || [];
    for (const cl of cardlists) {
      const views = cl.cardviews || cl.views || [];
      // 检查是否是 commander 列表（url 以 /commanders/ 开头）
      const isCommanderList = views.some(function(v) {
        return v.url && v.url.indexOf('/commanders/') === 0;
      });
      if (isCommanderList && views.length > commanders.length) {
        commanders = views.map(function(v) {
          return {
            name: v.name || v.sanitized || '',
            num_decks: v.num_decks || 0,
          };
        });
      }
    }

    // 按 num_decks 排序，取 Top 3
    commanders.sort(function(a, b) { return b.num_decks - a.num_decks; });
    commanders = commanders.slice(0, 3);

    if (commanders.length === 0) {
      container.innerHTML = '';
      return;
    }

    // 获取每张指挥官的图片（通过 Scryfall）
    const commandersWithImages = await Promise.all(
      commanders.map(async function(cmdr) {
        try {
          const sfData = await ScryfallService.fetchCard(cmdr.name);
          cmdr.image_uri = ScryfallService._getImageUri(sfData);
        } catch (e) {
          cmdr.image_uri = null;
        }
        return cmdr;
      })
    );

    // 缓存
    ScryfallService._setCache(cacheKey, commandersWithImages);
    renderCommanders(container, commandersWithImages);

  } catch (err) {
    console.warn('EDHREC Commanders 加载失败:', err);
    container.innerHTML = '';
  }
}

function renderCommanders(container, commanders) {
  if (!commanders || commanders.length === 0) {
    container.innerHTML = '';
    return;
  }

  let html = '<div style="font-size:0.85em;color:#5eb3f3;margin-bottom:8px;font-weight:bold">🏆 Top Commanders</div>';
  html += '<div class="edh-commanders">';

  for (const cmdr of commanders) {
    const imgHtml = cmdr.image_uri
      ? '<img src="' + cmdr.image_uri + '" alt="' + escapeHtml(cmdr.name) + '">'
      : '<div class="cmdr-loading">🖼️</div>';
    const decksStr = cmdr.num_decks > 0 ? formatNumber(cmdr.num_decks) + ' 卡组' : '';

    html += '<div class="commander-card">' +
      imgHtml +
      '<div class="cmdr-name">' + escapeHtml(cmdr.name) + '</div>' +
      '<div class="cmdr-decks">' + decksStr + '</div>' +
    '</div>';
  }

  html += '</div>';
  container.innerHTML = html;
}

// ============================================================
// 趋势折线图
// ============================================================

function initTrendChart(dates, datasets) {
  const ctx = document.getElementById('trendChart');
  if (!ctx) return;

  // 销毁旧图表（如果存在）
  if (window._trendChartInstance) {
    window._trendChartInstance.destroy();
  }

  window._trendChartInstance = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [
        {
          label: 'Standard',
          data: datasets.standard,
          borderColor: '#f39c12',
          backgroundColor: 'rgba(243, 156, 18, 0.1)',
          tension: 0.3,
          fill: false,
          pointRadius: 4,
          pointHoverRadius: 6,
        },
        {
          label: 'Modern',
          data: datasets.modern,
          borderColor: '#e74c3c',
          backgroundColor: 'rgba(231, 76, 60, 0.1)',
          tension: 0.3,
          fill: false,
          pointRadius: 4,
          pointHoverRadius: 6,
        },
        {
          label: 'Pauper',
          data: datasets.pauper,
          borderColor: '#51cf66',
          backgroundColor: 'rgba(81, 207, 102, 0.1)',
          tension: 0.3,
          fill: false,
          pointRadius: 4,
          pointHoverRadius: 6,
        },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          labels: { color: '#868e96', usePointStyle: true, padding: 16 },
        },
      },
      scales: {
        x: {
          ticks: { color: '#868e96', maxTicksLimit: 8 },
          grid: { color: '#dee2e6' },
        },
        y: {
          ticks: { color: '#868e96', beginAtZero: true },
          grid: { color: '#dee2e6' },
          title: { display: true, text: '使用张数', color: '#868e96' },
        },
      },
      interaction: {
        intersect: false,
        mode: 'index',
      },
    },
  });
}

// ============================================================
// 工具函数
// ============================================================

function escapeHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function formatNumber(n) {
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
